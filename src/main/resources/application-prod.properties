spring.datasource.url=jdbc:mysql://localhost:3306/srr_db?createDatabaseIfNotExist=true&autoReconnect=true&useSSL=false
spring.datasource.username=srrDB
spring.datasource.password=srrDB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect =org.hibernate.dialect.MySQL5InnoDBDialect
spring.devtools.restart.enabled=true
spring.jpa.show-sql=true
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.mvc.format.date=dd-MM-yyyy
spring.mvc.format.date-time=dd-MM-yyyy HH:mm:ss
spring.mvc.format.time=HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

spring.session.jdbc.initialize-schema=always
spring.session.timeout.seconds=900

spring.http.converters.preferred-json-mapper=gson

